services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./runtime:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ..:/srv/site:ro
      - caddy_data:/data
volumes:
  caddy_data:

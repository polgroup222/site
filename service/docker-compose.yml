services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./runtime:/data
    # захист: без зайвих прав root усередині контейнера; сам сервіс працює від користувача node
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    pids_limit: 512
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ..:/srv/site:ro
      - /root/media:/srv/media:ro
      - caddy_data:/data
volumes:
  caddy_data:
